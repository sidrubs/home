# Flux Kustomization for Longhorn storage.
# Deployed before the rest of infrastructure so the encrypted StorageClass
# is available when adguard and other components create PVCs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/infrastructure/longhorn
  dependsOn:
    - name: crds
  decryption:
    provider: sops
    secretRef:
      name: sops-age
