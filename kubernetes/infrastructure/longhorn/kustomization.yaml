# Kustomization for Longhorn distributed block storage.
# Includes namespace, HelmRelease, encrypted StorageClass, VolumeSnapshotClass, and crypto secret.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrelease.yaml
  - encrypted-storage/longhorn-encrypted-storage-class.yaml
  - encrypted-storage/secrets/longhorn-encrypted-storage-secrets.yaml
  - snapshot-functionality/longhorn-snapshot-class.yaml
