# HelmRelease for Longhorn distributed block storage.
# Pulls from the longhorn HelmRepository in flux-system and deploys to longhorn-system.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 10m
  chart:
    spec:
      chart: longhorn
      version: 1.10.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # https://joshrnoll.com/installing-longhorn-on-talos-with-helm/#customize-the-install-with-valuesyaml
    defaultSettings:
      defaultReplicaCount: 1
      # Path to UserVolume set up in talos
      defaultDataPath: "/var/mnt/longhorn/"
    persistence:
      # Don't make Longhorn's built-in class the default — the encrypted class in
      # encrypted-storage/longhorn-encrypted-storage-class.yaml is set as default instead.
      defaultClass: false
      defaultClassReplicaCount: 1
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1
    longhornUI:
      replicas: 1
    namespaceOverride: longhorn-system
